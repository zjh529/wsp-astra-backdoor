[project]
name = "pi-weight-space-programming"
version = "0.0.3"
description = "Pi harness extension, tools, and skills for Weight-Space Programming: natively reading, interpreting, and editing neural network weights without gradient descent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26.0",
    "safetensors>=0.4.0",
]

[dependency-groups]
dev = [
    "pillow>=10.0.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false
