# Canonical 185-model bank. Editing rates, epochs, or normalization changes the
# config hash. Point a changed recipe at a new --output directory.
# Do not edit this file after looking at test-set ASR.

matrix_id: vision-badnet-185-v1
target_class: 0
baseline_poison_rate: "0.10"
baseline_patch_size: 3
seeds: [0, 1, 2, 3, 4]

expect_unique_models: 185
expect_pilot_models: 6
expect_introduced_by:
  G0: 30
  G1: 45
  G2: 30
  G3: 40
  G4: 40

protocol_notes:
  - "Bottom-right white patch or full-image blend is applied after augmentation while pixels are in [0, 1], then normalized."
  - "Clean and poisoned runs that share dataset, architecture, width, and seed load one saved initialization and the same fit-set order."
  - "Poison count is p times the official full training-set size, drawn only from non-target fit examples. Smaller rates are nested prefixes."
  - "Validation is a fixed stratified 1/10 of the official training set and is never poisoned. The official test set is not used until final evaluation."
  - "The saved model is the final epoch. Best validation accuracy is diagnostic only."

architectures:
  - {id: mnist_mlp, dataset: mnist, arch: mlp, in_g0: true, in_g1: true, in_g2: false, in_g3: false, in_g4: false}
  - {id: mnist_cnn, dataset: mnist, arch: cnn, in_g0: true, in_g1: true, in_g2: true, in_g3: true, in_g4: true}
  - {id: cifar10_cnn, dataset: cifar10, arch: cnn, in_g0: true, in_g1: true, in_g2: true, in_g3: true, in_g4: true}

groups:
  G0: {}
  G1:
    poison_rates: ["0.01", "0.05", "0.10", "0.20"]
  G2:
    poison_rate: "0.10"
    patch_sizes:
      mnist: [1, 2, 3, 5]
      cifar10: [2, 3, 4, 6]
  G3:
    poison_rate: "0.10"
    alphas: ["0.10", "0.20", "0.35", "0.50"]
  G4:
    width_multipliers: [1, 2, 4]

training:
  optimizer: adam
  lr: "0.001"
  weight_decay: "0"
  batch_size: 128
  epochs_by_architecture:
    # Chosen before any test-set read of this bank. Do not retune from ASR.
    mnist_mlp: 20
    mnist_cnn: 8
    cifar10_cnn: 20
  num_workers: 0
  cpu_threads: 4
  checkpoint_every_batches: 20
  val_fraction: "1/10"
  split_seed: 20260327

preprocessing:
  mnist:
    mean: ["0.1307"]
    std: ["0.3081"]
    train_augment: identity
  cifar10:
    mean: ["0.4914", "0.4822", "0.4465"]
    std: ["0.2470", "0.2435", "0.2616"]
    train_augment: random_crop_flip
    crop_padding: 4

resources:
  require_explicit_gpus: true
  idle_util_percent_max: 5
  idle_memory_mib_max: 4096
  forbid_if_compute_processes: true
  max_concurrency_per_gpu: 1
  cpu_workers_max: 2
  on_oom: reduce_concurrency

pilot:
  seed: 0
  width: 1
  engineering_gates:
    # Engineering checks for the six-model pilot only. Not scientific acceptance.
    mnist_clean_acc_min: "0.97"
    cifar10_clean_acc_min: "0.60"
    baseline_asr_min: "0.90"
